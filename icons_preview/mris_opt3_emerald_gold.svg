<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011710"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bgGrad3)"/>
  <rect x="36" y="36" width="952" height="952" rx="220" fill="none" stroke="url(#goldGrad3)" stroke-width="8" stroke-opacity="0.75"/>

  <!-- Circular Geometric Mandala/Ornament Accent -->
  <circle cx="512" cy="430" r="280" fill="none" stroke="url(#goldGrad3)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 12"/>
  <circle cx="512" cy="430" r="320" fill="none" stroke="url(#goldGrad3)" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Center Master Emblem: Monogram 'M' with Chef Hat & POS Receipt -->
  <g filter="url(#shadow3)">
    <!-- Outer Shield / Hexagon -->
    <polygon points="512,180 730,300 730,560 512,680 294,560 294,300" fill="#06382b" stroke="url(#goldGrad3)" stroke-width="14"/>

    <!-- Crown / Chef Toque on top -->
    <path d="M440 250 C440 200 480 200 512 200 C544 200 584 200 584 250 Z" fill="url(#goldGrad3)"/>

    <!-- Stylized 3D 'M' Monogram (MRIS) -->
    <path d="M360 570 L360 330 L450 480 L512 400 L574 480 L664 330 L664 570 L600 570 L600 420 L538 520 L486 520 L424 420 L424 570 Z" fill="url(#goldGrad3)"/>

    <!-- Fast Checkout Sparkles -->
    <circle cx="512" cy="620" r="16" fill="#fde047"/>
  </g>

  <!-- Typography: MRIS -->
  <text x="512" y="855" font-family="-apple-system, BlinkMacSystemFont, 'Cinzel', 'Montserrat', serif" font-size="110" font-weight="900" fill="url(#goldGrad3)" letter-spacing="18" text-anchor="middle">MRIS</text>
  
  <!-- Subtitle: KASIR RESTORAN -->
  <rect x="360" y="888" width="304" height="42" rx="21" fill="rgba(234, 179, 8, 0.15)" stroke="url(#goldGrad3)" stroke-width="2"/>
  <text x="512" y="916" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="900" fill="#fef08a" letter-spacing="6" text-anchor="middle">KASIR RESTORAN</text>
</svg>