<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="cyanGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#032b45" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bgGrad2)"/>
  <rect x="36" y="36" width="952" height="952" rx="220" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Glowing Aura -->
  <circle cx="512" cy="430" r="300" fill="#38bdf8" opacity="0.25"/>

  <!-- Center Card Emblem -->
  <g filter="url(#shadow2)">
    <!-- White Sleek Tablet Pos -->
    <rect x="260" y="220" width="504" height="420" rx="36" fill="url(#cardGrad2)"/>
    <rect x="284" y="244" width="456" height="372" rx="26" fill="#0f172a"/>

    <!-- Screen UI Elements -->
    <!-- Top Header in Screen -->
    <rect x="310" y="270" width="404" height="48" rx="10" fill="#1e293b"/>
    <circle cx="340" cy="294" r="12" fill="#38bdf8"/>
    <rect x="366" y="286" width="120" height="16" rx="4" fill="#94a3b8"/>
    <rect x="630" y="280" width="64" height="28" rx="8" fill="#10b981"/>

    <!-- Screen Grid: Restaurant Menu Cards -->
    <rect x="310" y="334" width="124" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="450" y="334" width="124" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="590" y="334" width="124" height="110" rx="14" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="652" cy="389" r="24" fill="#38bdf8"/>
    <text x="652" y="399" font-family="sans-serif" font-size="28" font-weight="900" fill="#082f49" text-anchor="middle">✓</text>

    <!-- Bottom Cart Bar in Screen -->
    <rect x="310" y="464" width="404" height="126" rx="16" fill="linear-gradient(135deg, #0284c7, #0369a1)"/>
    <text x="336" y="512" font-family="sans-serif" font-size="20" font-weight="700" fill="#bae6fd">TOTAL TAGIHAN</text>
    <text x="336" y="556" font-family="sans-serif" font-size="34" font-weight="900" fill="#ffffff">Rp 185.000</text>
    <rect x="576" y="490" width="118" height="74" rx="14" fill="#ffffff"/>
    <text x="635" y="536" font-family="sans-serif" font-size="22" font-weight="900" fill="#0284c7" text-anchor="middle">BAYAR</text>

    <!-- Stand -->
    <path d="M430 640 L380 730 L644 730 L594 640 Z" fill="#e2e8f0"/>
    <rect x="340" y="726" width="344" height="24" rx="12" fill="#cbd5e1"/>
  </g>

  <!-- Typography: MRIS -->
  <text x="512" y="855" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="112" font-weight="900" fill="#ffffff" letter-spacing="16" text-anchor="middle">MRIS</text>
  
  <!-- Subtext: BAROKAH POS -->
  <rect x="352" y="888" width="320" height="42" rx="21" fill="rgba(255,255,255,0.2)"/>
  <text x="512" y="916" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="900" fill="#e0f2fe" letter-spacing="6" text-anchor="middle">BAROKAH POS</text>
</svg>